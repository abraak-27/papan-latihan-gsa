<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papan Latihan — Perancang Sesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d0a;--glow:#13261b;--panel:#0f1812;--panel2:#17231b;--line:rgba(255,255,255,.09);--txt:#eef3ef;--mut:#8da296;--yel:#f5c542;--grn:#2fbf71;--inp:#0a110d;--stage:#050a07;--g1:#f5c542;--g2:#2fbf71;color-scheme:dark}
[data-theme=light]{--bg:#eaf0ec;--glow:#ffffff;--panel:#ffffff;--panel2:#e9f0ec;--line:rgba(10,30,20,.15);--txt:#13201a;--mut:#58695f;--inp:#ffffff;--stage:#d9e3dd;--g1:#c98a00;--g2:#1f9d5a;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1000px 500px at 50% -10%,var(--glow) 0%,var(--bg) 60%);color:var(--txt);font:13px/1.4 Inter,system-ui,sans-serif;min-height:100vh;padding:12px 12px 40px}
.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:8px}
.eyebrow{font-size:9.5px;letter-spacing:.16em;color:var(--mut);font-weight:600;text-transform:uppercase}
.brand b{font-size:17px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea,select{font:500 12.5px Inter,sans-serif;background:var(--inp);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--yel)}
.top input{flex:1;min-width:110px;width:auto}
textarea{resize:vertical;min-height:44px}
label.f{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:7px 0 3px}
.btn,.chip,.tab{font:600 12px Inter,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:5px 9px;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover,.chip:hover,.tab:hover{background:var(--panel2)}
.on{background:var(--yel)!important;color:#1a1500!important;border-color:var(--yel)!important}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tab{padding:4px 9px}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:1020px){.main{grid-template-columns:minmax(0,1fr) 272px}}
.left{display:flex;gap:8px;align-items:flex-start}
.center{flex:1;min-width:0}
.pal{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;position:sticky;top:8px;flex:none}
.pal .chip{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:14px;color:var(--txt)}
.pal .chip svg{width:18px;height:18px}
.pi{font-style:normal;font-weight:800;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.pal hr{border:0;border-top:1px solid var(--line);margin:2px 3px}
@media(max-width:700px){.left{flex-direction:column}.pal{flex-direction:row;flex-wrap:wrap;position:static;width:100%}.pal hr{border-top:0;border-left:1px solid var(--line);margin:3px 2px;height:22px}}
.view{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.seg{display:flex;gap:3px;align-items:center}
select.sm{width:auto;padding:4px 6px;font-size:12px}
.sp{flex:1}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:12px;padding:4px;display:flex;justify-content:center;align-items:center;min-height:200px}
canvas#cv{display:block;border-radius:8px;touch-action:none;cursor:default}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.hint b{color:var(--txt)}
.side{display:flex;flex-direction:column;gap:8px}
details.card{background:var(--panel);border:1px solid var(--line);border-radius:11px}
details.card>summary{cursor:pointer;list-style:none;padding:8px 11px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'▾';float:right}
details.card:not([open])>summary::after{content:'▸'}
details.card>.body{padding:0 11px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;gap:4px;flex-wrap:wrap}
.mm{display:flex;gap:8px;align-items:center}
#mm{border-radius:6px;border:1px solid var(--line);cursor:pointer}
.sum{font-size:12px;line-height:1.55}
.swatches{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.swatches button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatches button.sel{border-color:#fff;outline:2px solid var(--yel)}
.copy{background:linear-gradient(90deg,var(--yel),var(--grn));color:#0b1a10;border:0}
#out{margin-top:8px;display:none;min-height:150px;font-family:ui-monospace,monospace;font-size:11.5px}
.logo{height:38px;width:auto;display:block;margin-right:2px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.lf{display:flex;justify-content:space-between;align-items:center}
.lm{display:flex;gap:2px}
.lmb{font:700 11px Inter,sans-serif;text-transform:none;letter-spacing:0;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:5px;padding:0 6px;height:18px;cursor:pointer}
.lmb:hover{background:var(--panel2)}
.lmb.on{background:var(--yel);color:#1a1500;border-color:var(--yel)}
.rte{min-height:46px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--inp);font:500 12.5px/1.45 Inter,sans-serif;outline:0;overflow-wrap:anywhere}
.rte:focus{border-color:var(--yel)}
.rte:empty::before{content:attr(data-ph);color:var(--mut)}
.rte ul,.rte ol{margin:2px 0;padding-left:22px}
.rte li{margin:1px 0}
.rte ul ul,.rte ol ol,.rte ul ol,.rte ol ul{margin:0;padding-left:20px}
.rte div{min-height:1.2em}
#zVal{min-width:50px}
.stat{font-size:11px;color:var(--mut);white-space:nowrap}
[hidden]{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding:12px;gap:8px;box-shadow:-10px 0 40px rgba(0,0,0,.35)}
.dh{display:flex;align-items:center;gap:8px;font-size:15px}
.dc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#libBody{flex:1;overflow:auto;padding-right:2px}
.gh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px;font-weight:700}
.ses{display:flex;gap:10px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:6px;background:var(--panel2);cursor:pointer}
.ses:hover{border-color:var(--mut)}
.ses.cur{border-color:var(--yel)}
.ses .dt{min-width:42px;text-align:center;line-height:1.1}
.ses .dt b{font-size:20px;display:block}
.ses .dt small{font-size:10px;color:var(--mut);text-transform:uppercase}
.ses .mid{flex:1;min-width:0}
.ses .tt{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ses .mt{font-size:11.5px;color:var(--mut)}
.ses .pl{margin-top:3px}
.ses .pill{font-size:11px;padding:1px 7px;margin:2px 3px 0 0}
.ses .act{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ses .act .btn{padding:2px 8px;font-size:11px}
.badge{font-size:10px;background:var(--yel);color:#1a1500;border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:700}
.calh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.calh b{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dw{font-size:10px;color:var(--mut);text-align:center;padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12px}
.cal .d.has{background:var(--panel2);font-weight:700}
.cal .d.today{outline:1.5px solid var(--grn)}
.cal .d.sel{background:var(--yel);color:#1a1500}
.cal .dots{display:flex;gap:2px}
.cal .dot{width:5px;height:5px;border-radius:50%;background:var(--grn);display:block}
</style>
</head>

function blankDrill(name){return{rt:1,name:name||'Latihan baru',goal:'',dur:15,fmt:'',rules:'',points:'',prog:'',pitch:'105x68',mode:'full',part:0,rot:false,objs:[]};}

  [[44,24],[44,44],[36,34],[28,28],[28,40]].forEach((p,i)=>add(d2,{t:'pl',x:p[0],y:p[1],team:'B',label:String(i+1)}));

const LS_LIB='sp-lib-v1',LS_UI='sp-ui';
let LIB={},remote=null,rdirty=new Set(),rtimer=null,rbusy=false,rfail=0;
const sesId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function normSession(s){
  if(!s.id)s.id=sesId();
  if(!Array.isArray(s.drills)||!s.drills.length)s.drills=[blankDrill('Latihan 1')];
  s.drills.forEach(normDrill);
  if(typeof s.cur!=='number'||s.cur<0||s.cur>=s.drills.length)s.cur=0;
  s.title=s.title||'';s.cat=s.cat||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(s.date||''))s.date='';
  s.drills.forEach(d=>{if(!PITCHES[d.pitch])d.pitch='105x68';});
  return s;
}
function persistLocal(){try{localStorage.setItem(LS_LIB,JSON.stringify({cur:S.id,sessions:LIB}));}catch(e){}}
function loadLocal(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS_LIB)||'null');
    if(raw&&raw.sessions){
      Object.keys(raw.sessions).forEach(id=>{const e=raw.sessions[id];
        if(e&&e.data&&Array.isArray(e.data.drills)&&e.data.drills.length){e.data.id=id;normSession(e.data);LIB[id]={updated:e.updated||0,data:e.data,sig:JSON.stringify(e.data)};}});
      if(LIB[raw.cur])S=LIB[raw.cur].data;else if(Object.keys(LIB).length)S=Object.values(LIB)[0].data;
    }
  }catch(e){}
  try{const u=JSON.parse(localStorage.getItem(LS_UI)||'null');if(u)UI=Object.assign(UI,u);}catch(e){}
  if(!S){
    try{const o=JSON.parse(localStorage.getItem('sp-v2')||'null');
      if(o&&Array.isArray(o.drills)&&o.drills.length){if(o.ui)UI=Object.assign(UI,o.ui);delete o.ui;S=normSession(o);}}catch(e){}
  }
  if(!S){S=normSession(demo());S.date=todayISO();LIB[S.id]={updated:Date.now(),data:S,sig:''};}
  if(!LIB[S.id])LIB[S.id]={updated:Date.now(),data:S,sig:''};
  LIB[S.id].data=S;
}
function setStat(t){const a=$('stat');if(a)a.textContent=t;}
function save(){
  try{localStorage.setItem(LS_UI,JSON.stringify(UI));}catch(e){}
  let e=LIB[S.id];const sg=JSON.stringify(S);
  if(e&&e.sig===sg){e.data=S;return;}
  if(!e){e=LIB[S.id]={updated:0,data:S,sig:''};}
  e.data=S;e.sig=sg;e.updated=Date.now();
  persistLocal();queueRemote(S.id);
}
function pack(e){const s=e.data;return{title:s.title||'',date:s.date||'',cat:s.cat||'',updated:e.updated,n:s.drills.length,min:s.drills.reduce((a,d)=>a+(d.dur||0),0),json:JSON.stringify(s)};}
function queueRemote(id){
  if(!remote){setStat('Tersimpan di browser');return;}
  setStat('Menyimpan…');rdirty.add(id);clearTimeout(rtimer);rtimer=setTimeout(flushRemote,1500);
}
async function flushRemote(){
  if(!remote)return;
  if(rbusy){rtimer=setTimeout(flushRemote,800);return;}
  rbusy=true;let ok=true;
  for(const id of [...rdirty]){
    rdirty.delete(id);const e=LIB[id];if(!e)continue;
    try{await remote.col.doc(id).set(pack(e));}
    catch(err){
      let done=false;
      if(err&&err.code==='unavailable'){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await remote.col.doc(id).set(pack(e));done=true;}catch(e2){}}
      if(!done){ok=false;rdirty.add(id);}
    }
  }
  rbusy=false;
  if(ok){rfail=0;setStat('Tersimpan ✓ di akun');}
  else{rfail++;setStat('Sinkron tertunda — aman di browser');if(rfail<4){clearTimeout(rtimer);rtimer=setTimeout(flushRemote,15000);}}
  renderLibrary();
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const col=db.collection('data/users/'+uid);
    const snap=await Promise.race([col.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    remote={col,uid};let curChanged=false;
    snap.docs.forEach(d=>{
      const v=d.data();if(!v||typeof v.json!=='string')return;
      const loc=LIB[d.id];
      if(!loc||(v.updated||0)>loc.updated){
        let o;try{o=JSON.parse(v.json);}catch(e){return;}
        if(!o||!Array.isArray(o.drills)||!o.drills.length)return;
        o.id=d.id;normSession(o);LIB[d.id]={updated:v.updated||0,data:o,sig:JSON.stringify(o)};
        if(d.id===S.id){S=o;curChanged=true;}
      }
    });
    Object.keys(LIB).forEach(id=>{const rd=snap.docs.find(d=>d.id===id);if(!rd||LIB[id].updated>(((rd.data()||{}).updated)||0))rdirty.add(id);});
    persistLocal();
    if(curChanged){lastSnap=JSON.stringify(S);undo=[];redo=[];selId=null;refreshAll();}
    if(rdirty.size){clearTimeout(rtimer);rtimer=setTimeout(flushRemote,300);setStat('Menyinkronkan…');}else setStat('Tersinkron ✓ di akun');
    renderLibrary();
  }catch(e){setStat('Tersimpan di browser');}
}

/* ---------- library ---------- */
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],DOW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
let libView='list',calY=0,calM=0,calSel=null,confirmDel=null;
const p2=n=>String(n).padStart(2,'0');
const mk=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x;};
const sessMin=s=>s.drills.reduce((a,d)=>a+(d.dur||0),0);
function parseISO(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function fmtShort(iso){const d=parseISO(iso);return d?{day:d.getDate(),dow:d.toLocaleDateString('id-ID',{weekday:'short'}),mon:MONTHS[d.getMonth()]+' '+d.getFullYear()}:null;}
function sortedSessions(){
  return Object.keys(LIB).map(id=>LIB[id]).sort((a,b)=>{const x=a.data.date||'',y=b.data.date||'';return x<y?1:x>y?-1:b.updated-a.updated;}).map(e=>e.data);
}
function sessMatches(s,q){if(!q)return true;return (s.title+' '+s.cat+' '+s.drills.map(d=>d.name).join(' ')).toLowerCase().indexOf(q)>=0;}
function openSession(id,keepOpen){
  const e=LIB[id];if(!e)return;save();
  S=e.data;selId=null;undo=[];redo=[];lastSnap=JSON.stringify(S);persistLocal();refreshAll();
  if(!keepOpen)closeLib();else renderLibrary();
}
function newSession(date){
  save();
  const o=normSession({id:sesId(),title:'',date:date||todayISO(),cat:'',cur:0,drills:[blankDrill('Latihan 1')]});
  LIB[o.id]={updated:0,data:o,sig:''};S=o;selId=null;undo=[];redo=[];lastSnap=JSON.stringify(S);save();refreshAll();closeLib();
  setTimeout(()=>{const t=$('sTitle');if(t){t.focus();}},50);
}
function dupSession(id){
  const e=LIB[id];if(!e)return;
  const c=JSON.parse(JSON.stringify(e.data));c.id=sesId();c.title=(c.title||'Sesi')+' (salinan)';
  LIB[c.id]={updated:Date.now(),data:c,sig:JSON.stringify(c)};persistLocal();queueRemote(c.id);renderLibrary();
}
function delSession(id){
  delete LIB[id];rdirty.delete(id);
  if(remote){try{remote.col.doc(id).delete().catch(()=>{});}catch(e){}}
  if(id===S.id){
    const rest=sortedSessions();
    if(rest.length)S=rest[0];
    else{S=normSession({id:sesId(),title:'',date:todayISO(),cat:'',cur:0,drills:[blankDrill('Latihan 1')]});LIB[S.id]={updated:Date.now(),data:S,sig:''};}
    selId=null;undo=[];redo=[];lastSnap=JSON.stringify(S);refreshAll();
  }
  confirmDel=null;persistLocal();renderLibrary();
}
function sesCard(s){
  const c=mk('div','ses'+(s.id===S.id?' cur':'')),f=fmtShort(s.date),dt=mk('div','dt');
  if(f){dt.appendChild(mk('b','',String(f.day)));dt.appendChild(mk('small','',f.dow));}else dt.appendChild(mk('small','','—'));
  const mid=mk('div','mid'),tt=mk('div','tt',s.title||'Sesi tanpa judul');
  if(s.id===S.id)tt.appendChild(mk('span','badge','dibuka'));
  mid.appendChild(tt);
  mid.appendChild(mk('div','mt',[s.cat,s.drills.length+' latihan',sessMin(s)+' mnt'].filter(Boolean).join(' · ')));
  const pl=mk('div','pl');s.drills.slice(0,3).forEach(d=>pl.appendChild(mk('span','pill',d.name)));if(s.drills.length>3)pl.appendChild(mk('span','pill','+'+(s.drills.length-3)));mid.appendChild(pl);
  const act=mk('div','act');
  const b=(t,fn)=>{const x=mk('button','btn',t);x.onclick=ev=>{ev.stopPropagation();fn();};act.appendChild(x);return x;};
  if(confirmDel===s.id){act.appendChild(mk('span','mt','Hapus sesi ini?'));b('Ya, hapus',()=>delSession(s.id));b('Batal',()=>{confirmDel=null;renderLibrary();});}
  else{b('Buka',()=>openSession(s.id));b('PDF',()=>exportPdf([s]));b('Bagikan',()=>exportJson([s.id]));b('Duplikat',()=>dupSession(s.id));b('Hapus',()=>{confirmDel=s.id;renderLibrary();});}
  mid.appendChild(act);c.append(dt,mid);c.onclick=()=>openSession(s.id);return c;
}
function renderCal(body,all){
  const head=mk('div','calh'),pv=mk('button','btn','◀'),nx=mk('button','btn','▶'),td=mk('button','btn','Hari ini');
  pv.onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderLibrary();};
  nx.onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderLibrary();};
  td.onclick=()=>{const t=new Date();calY=t.getFullYear();calM=t.getMonth();calSel=todayISO();renderLibrary();};
  head.append(pv,mk('b','',MONTHS[calM]+' '+calY),nx,td);body.appendChild(head);
  const g=mk('div','cal');DOW.forEach(x=>g.appendChild(mk('div','dw',x)));
  const off=(new Date(calY,calM,1).getDay()+6)%7,days=new Date(calY,calM+1,0).getDate(),by={},tIso=todayISO();
  all.forEach(s=>{if(s.date)(by[s.date]=by[s.date]||[]).push(s);});
  for(let i=0;i<off;i++)g.appendChild(mk('div'));
  for(let d=1;d<=days;d++){
    const iso=calY+'-'+p2(calM+1)+'-'+p2(d),cell=mk('div','d'+(by[iso]?' has':'')+(iso===calSel?' sel':'')+(iso===tIso?' today':''));
    cell.appendChild(mk('span','',String(d)));
    if(by[iso]){const dots=mk('div','dots');for(let k=0;k<Math.min(3,by[iso].length);k++)dots.appendChild(mk('i','dot'));cell.appendChild(dots);}
    cell.onclick=()=>{calSel=iso;renderLibrary();};g.appendChild(cell);
  }
  body.appendChild(g);
  const sel=calSel||tIso,dd=parseISO(sel);
  body.appendChild(mk('div','gh',dd?dd.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):sel));
  (by[sel]||[]).forEach(s=>body.appendChild(sesCard(s)));
  if(!(by[sel]||[]).length)body.appendChild(mk('div','sum','Belum ada sesi di tanggal ini.'));
  const nb=mk('button','btn copy','＋ Sesi baru di tanggal ini');nb.style.marginTop='6px';nb.onclick=()=>newSession(sel);body.appendChild(nb);
}
function renderLibrary(){
  const dr=$('lib');if(!dr||dr.hidden)return;
  const body=$('libBody');body.innerHTML='';
  $('vList').classList.toggle('on',libView==='list');$('vCal').classList.toggle('on',libView==='cal');
  const q=($('libQ').value||'').trim().toLowerCase(),all=sortedSessions().filter(s=>sessMatches(s,q));
  if(libView==='list'){
    if(!all.length)body.appendChild(mk('div','sum','Belum ada sesi yang cocok.'));

  const pt0=evPt(e);
  if(e.pointerType==='touch'){ptrs.set(e.pointerId,pt0);if(ptrs.size===2){drag=null;pinchInit();return;}}
  if(e.button===1||spaceDown){e.preventDefault();drag={k:'pan',last:pt0};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';return;}
  if(e.button!==0)return;
  const pt=pt0,w=s2w(pt[0],pt[1]),d=D();
  if(tool==='sel'){
    const so=selObj();if(so){const h=hitHandle(so,pt);if(h){drag={k:'handle',o:so,h};cv.setPointerCapture(e.pointerId);return;}}
    const hit=pick(pt);
    if(hit){selId=hit.id;drag={k:'move',o:hit,sx:w[0],sy:w[1],o0:JSON.parse(JSON.stringify(hit))};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';}
    else{selId=null;drag={k:'pan',last:pt};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';}
    renderProps();draw();return;
  }
  const px=snapv(w[0]),py=snapv(w[1]);
  if(tool.startsWith('pl:')){const team=tool.slice(3);const n=d.objs.filter(o=>o.t==='pl'&&o.team===team).length+1;
    const o=add(d,{t:'pl',x:px,y:py,team,label:team==='K'?'GK':team==='P'?'C':String(n)});selId=o.id;commit();renderAll();return;}
  if(tool==='cone'){const o=add(d,{t:'cone',x:px,y:py,col:'#fb923c'});selId=o.id;commit();renderAll();return;}
  if(tool==='ball'||tool==='dummy'){const o=add(d,{t:tool,x:px,y:py});selId=o.id;commit();renderAll();return;}
  if(tool==='goal'){const o=add(d,{t:'goal',x:px,y:py,w:7.32,h:2.44,rot:px<PITCHES[d.pitch][0]/2?270:90});selId=o.id;commit();renderAll();return;}
  if(tool==='mini'){const o=add(d,{t:'mini',x:px,y:py,w:3,h:1,rot:px<PITCHES[d.pitch][0]/2?270:90});selId=o.id;commit();renderAll();return;}
  if(tool==='text'){const o=add(d,{t:'text',x:px,y:py,text:'Teks'});selId=o.id;commit();setTool('sel');renderAll();const i=document.querySelector('#props input');if(i){i.focus();i.select();}return;}
  if(tool==='zone'){drag={k:'new',o:{t:'zone',x:px,y:py,w:0,h:0,col:'#ffffff',label:'',_x:px,_y:py}};}
  else if(tool.startsWith('line:')){drag={k:'new',o:{t:'line',kind:tool.slice(5),x:px,y:py,x2:px,y2:py,col:''}};}
  else if(tool==='measure'){drag={k:'new',o:{t:'measure',x:px,y:py,x2:px,y2:py}};}
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  const pt=evPt(e);
  if(ptrs.has(e.pointerId)){ptrs.set(e.pointerId,pt);if(pinch&&ptrs.size>=2){pinchMove();return;}}
  if(drag&&drag.k==='pan'){panBy(drag.last,pt);drag.last=pt;return;}
  if(!drag){if(tool==='sel'){const so=selObj();cv.style.cursor=(so&&hitHandle(so,pt))||pick(pt)?'grab':'default';}return;}
  const w=s2w(pt[0],pt[1]);
  if(drag.k==='move'){const o=drag.o,o0=drag.o0,dx=snapv(w[0]-drag.sx),dy=snapv(w[1]-drag.sy);
    o.x=o0.x+dx;o.y=o0.y+dy;if(o.x2!==undefined){o.x2=o0.x2+dx;o.y2=o0.y2+dy;}}
  else if(drag.k==='handle'){const o=drag.o,x=snapv(w[0]),y=snapv(w[1]);
    if(drag.h==='se'){o.w=Math.max(1,snapv(w[0]-o.x));o.h=Math.max(1,snapv(w[1]-o.y));}
    else if(drag.h==='p1'){o.x=x;o.y=y;}else{o.x2=x;o.y2=y;}}
  else if(drag.k==='new'){const n=drag.o,x=snapv(w[0]),y=snapv(w[1]);
    if(n.t==='zone'){n.x=Math.min(n._x,x);n.y=Math.min(n._y,y);n.w=Math.abs(x-n._x);n.h=Math.abs(y-n._y);}else{n.x2=x;n.y2=y;}}
  draw();if(drag.k!=='new')renderProps(true);
});
function endDrag(){
  if(!drag)return;
  if(drag.k==='pan'){drag=null;cv.style.cursor=spaceDown?'grab':'default';return;}
  if(drag.k==='new'){const n=drag.o;let ok=false;
    if(n.t==='zone'){ok=n.w>=1&&n.h>=1;delete n._x;delete n._y;}else ok=Math.hypot(n.x2-n.x,n.y2-n.y)>=0.5;
    if(ok){const o=add(D(),n);selId=o.id;if(n.t==='zone')setTool('sel');commit();renderAll();}}
  else{commit();renderProps();}
  drag=null;cv.style.cursor='default';draw();
}

const RTE=[['dGoal','goal'],['dRules','rules'],['dPts','points'],['dProg','prog']],RTE_KEYS=['goal','rules','points','prog'];
const escH=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function textToHtml(t){
  if(!t)return '';let out='',cur='';const close=()=>{if(cur){out+='</'+cur+'>';cur='';}};
  t.split('\n').forEach(line=>{let m;
    if((m=line.match(/^\s*[•\-\*]\s+(.*)$/))){if(cur!=='ul'){close();out+='<ul>';cur='ul';}out+='<li>'+escH(m[1])+'</li>';}
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){if(cur!=='ol'){close();out+='<ol>';cur='ol';}out+='<li>'+escH(m[1])+'</li>';}
    else{close();out+='<div>'+(line.trim()?escH(line):'<br>')+'</div>';}});
  close();return out;
}
function cleanHtml(node){
  let out='';
  node.childNodes.forEach(n=>{
    if(n.nodeType===3)out+=escH(n.nodeValue);
    else if(n.nodeType===1){const t=n.tagName.toLowerCase();
      if(t==='ul'||t==='ol')out+='<'+t+'>'+cleanHtml(n)+'</'+t+'>';
      else if(t==='li')out+='<li>'+cleanHtml(n)+'</li>';
      else if(t==='br')out+='<br>';
      else if(t==='div'||t==='p')out+='<div>'+cleanHtml(n)+'</div>';
      else out+=cleanHtml(n);}
  });
  return out;
}
function h2t(html){
  const root=document.createElement('div');root.innerHTML=html||'';const out=[];
  const inl=n=>{let t='';n.childNodes.forEach(c=>{if(c.nodeType===3)t+=c.nodeValue;else if(c.nodeType===1){const g=c.tagName.toLowerCase();if(g==='br')t+=' ';else if(g!=='ul'&&g!=='ol'&&g!=='div')t+=inl(c);}});return t;};
  const list=(el,depth)=>{let i=0;el.childNodes.forEach(c=>{if(c.nodeType!==1)return;const g=c.tagName.toLowerCase();
    if(g==='li'){i++;out.push('  '.repeat(depth)+(el.tagName.toLowerCase()==='ol'?i+'. ':'• ')+inl(c).trim());c.childNodes.forEach(cc=>{if(cc.nodeType===1&&/^(ul|ol)$/i.test(cc.tagName))list(cc,depth+1);});}
    else if(g==='ul'||g==='ol')list(c,depth+1);});};
  const block=el=>{let buf='';const flush=()=>{if(buf.trim())out.push(buf.trim());buf='';};
    el.childNodes.forEach(c=>{if(c.nodeType===3)buf+=c.nodeValue;else if(c.nodeType===1){const g=c.tagName.toLowerCase();
      if(g==='ul'||g==='ol'){flush();list(c,0);}else if(g==='div'||g==='p'){flush();block(c);}else if(g==='br')flush();else buf+=c.textContent;}});flush();};
  block(root);return out.join('\n');
}

// "- " / "* " / "• " atau "1. " di awal baris -> daftar menjorok otomatis
function autoList(el){
  const sel=window.getSelection();if(!sel||!sel.rangeCount||!sel.isCollapsed)return;
  const n=sel.anchorNode,off=sel.anchorOffset;if(!n||n.nodeType!==3||!el.contains(n))return;
  const m=n.nodeValue.slice(0,off).match(/^(?:([-*•–—])|(\d+)[.)])[  ]$/);if(!m)return;
  const P=n.parentNode;
  if(P.closest&&P.closest('li'))return;
  if(P!==el&&P.tagName!=='DIV')return;
  const isBr=x=>!!x&&x.nodeName==='BR',isBlk=x=>!!x&&x.nodeType===1&&/^(DIV|UL|OL|P|LI)$/.test(x.tagName);
  if(n.previousSibling&&!isBr(n.previousSibling))return;
  n.nodeValue=n.nodeValue.slice(off);
  const seg=[n];let x=n.nextSibling;while(x&&!isBr(x)&&!isBlk(x)){seg.push(x);x=x.nextSibling;}
  const before=n.previousSibling,after=x,ordered=!!m[2],tag=ordered?'ol':'ul';
  const list=document.createElement(tag),li=document.createElement('li');
  if(ordered&&+m[2]>1)list.setAttribute('start',m[2]);
  P.insertBefore(list,n);seg.forEach(nd=>li.appendChild(nd));
  const has=li.textContent.length>0;if(!has)li.innerHTML='<br>';
  list.appendChild(li);
  if(isBr(before))before.remove();
  if(isBr(after))after.remove();
  if(P!==el&&P.childNodes.length===1&&P.firstChild===list){P.replaceWith(list);}
  const r=document.createRange();if(has)r.setStart(n,0);else r.setStart(li,0);r.collapse(true);sel.removeAllRanges();sel.addRange(r);
}
function curLi(sel,el){const n=sel.anchorNode;if(!n)return null;const e=n.nodeType===1?n:n.parentNode;const li=e&&e.closest?e.closest('li'):null;return li&&el.contains(li)?li:null;}
function liIsEmpty(li){return li.textContent.replace(/[\s ]/g,'')===''&&!li.querySelector('ul,ol');}
function liAtStart(sel,li){if(!sel.isCollapsed)return false;const r=document.createRange();r.selectNodeContents(li);r.setEnd(sel.anchorNode,sel.anchorOffset);return r.toString().replace(/​/g,'')===''&&!r.cloneContents().querySelector('ul,ol');}
// keluar dari daftar: butir ini menjadi paragraf biasa; daftar di atas/bawahnya tetap utuh
function leaveList(li,el){
  const list=li.parentNode,pp=list.parentNode;
  const nested=pp!==el&&((pp.closest&&pp.closest('li'))||/^(UL|OL)$/.test(pp.tagName));
  if(nested){if(document.execCommand)document.execCommand('outdent');return;}
  const div=document.createElement('div'),subs=[];
  Array.from(li.childNodes).forEach(c=>{if(c.nodeType===1&&/^(UL|OL)$/.test(c.tagName))subs.push(c);else div.appendChild(c);});
  if(!div.childNodes.length||div.textContent===''&&!div.querySelector('br'))div.innerHTML='<br>';
  const prev=li.previousElementSibling,next=li.nextElementSibling;
  if(!prev&&!next)list.replaceWith(div,...subs);
  else if(!next){list.after(div,...subs);li.remove();}
  else if(!prev){list.before(div,...subs);li.remove();}
  else{const tail=list.cloneNode(false);while(li.nextSibling)tail.appendChild(li.nextSibling);list.after(div,...subs,tail);li.remove();}
  const r=document.createRange();r.setStart(div,0);r.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
}
function buildRTE(){
  try{document.execCommand('defaultParagraphSeparator',false,'div');}catch(e){}
  RTE.forEach(([id,k])=>{const el=$(id);
    el.addEventListener('input',()=>{autoList(el);D()[k]=cleanHtml(el);renderSummary();save();});
    el.addEventListener('blur',commit);
    el.addEventListener('keydown',e=>{
      if(e.isComposing)return;
      const sl=window.getSelection(),li=sl&&sl.rangeCount?curLi(sl,el):null;
      if(li&&sl.isCollapsed){
        if(e.key==='Enter'&&!e.shiftKey&&liIsEmpty(li)){e.preventDefault();leaveList(li,el);el.dispatchEvent(new Event('input',{bubbles:true}));return;}
        if(e.key==='Backspace'&&liAtStart(sl,li)){e.preventDefault();leaveList(li,el);el.dispatchEvent(new Event('input',{bubbles:true}));return;}
      }
      if(e.key!=='Tab')return;const sel=window.getSelection(),n=sel&&sel.anchorNode,pe=n&&(n.nodeType===1?n:n.parentNode);
      if(pe&&pe.closest&&pe.closest('li')&&document.execCommand){e.preventDefault();document.execCommand(e.shiftKey?'outdent':'indent');}});
    el.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');if(document.execCommand)document.execCommand('insertText',false,t);});
  });
}

  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click();return;}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();$('redo').click();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;

    commit();draw();renderProps(true);}
  else if(e.key==='+'||e.key==='=')zoomAt(1.25);
  else if(e.key==='-'||e.key==='_')zoomAt(1/1.25);
  else if(e.key==='0')zoomReset();

});

function h2lines(html){
  const root=document.createElement('div');root.innerHTML=html||'';const out=[];
  const inl=n=>{let t='';n.childNodes.forEach(c=>{if(c.nodeType===3)t+=c.nodeValue;else if(c.nodeType===1){const g=c.tagName.toLowerCase();if(g==='br')t+=' ';else if(g!=='ul'&&g!=='div'&&g!=='ol')t+=inl(c);}});return t.replace(/\s+/g,' ').trim();};
  const list=(el,depth)=>{let i=Math.max(0,(parseInt(el.getAttribute&&el.getAttribute('start'))||1)-1);el.childNodes.forEach(c=>{if(c.nodeType!==1)return;const g=c.tagName.toLowerCase();
    if(g==='li'){i++;out.push({d:depth,k:el.tagName.toLowerCase()==='ol'?'n':'b',n:i,t:inl(c)});c.childNodes.forEach(cc=>{if(cc.nodeType===1&&/^(ul|ol)$/i.test(cc.tagName))list(cc,depth+1);});}
    else if(g==='ul'||g==='ol')list(c,depth+1);});};
  const block=el=>{let buf='';const flush=()=>{if(buf.trim())out.push({d:0,k:'p',n:0,t:buf.replace(/\s+/g,' ').trim()});buf='';};
    el.childNodes.forEach(c=>{if(c.nodeType===3)buf+=c.nodeValue;else if(c.nodeType===1){const g=c.tagName.toLowerCase();
      if(g==='ul'||g==='ol'){flush();list(c,0);}else if(g==='div'||g==='p'){flush();block(c);}else if(g==='br')flush();else buf+=c.textContent;}});flush();};
  block(root);return out;
}

}

function renderDrillImage(d,maxW,maxH){
  const [L,Wd]=PITCHES[d.pitch],m=4;let x0,w;
  if(d.mode==='full'){x0=-m;w=L+2*m;}
  else if(d.mode==='half'){if(d.part===0){x0=-m;w=L/2+m+2;}else{x0=L/2-2;w=L/2+m+2;}}
  else{if(d.part===0){x0=-m;w=L/3+m+1;}else if(d.part===1){x0=L/3-1;w=L/3+2;}else{x0=2*L/3-1;w=L/3+m+1;}}
  const bh=Wd+2*m,vw=d.rot?bh:w,vh=d.rot?w:bh,asp=vw/vh;
  let pw=maxW,ph=pw/asp;if(ph>maxH){ph=maxH;pw=ph*asp;}
  const PX=9,c=document.createElement('canvas');c.width=Math.max(50,Math.round(pw*PX));c.height=Math.max(50,Math.round(ph*PX));
  const sv={ctx,theme,V:Object.assign({},V)};
  try{
    ctx=c.getContext('2d');theme='light';
    V.x0=x0;V.y0=-m;V.w=w;V.h=bh;V.rot=d.rot;V.sc=c.width/vw;V.cw=c.width;V.ch=c.height;V.dpr=1;
    ctx.setTransform(1,0,0,1,0,0);drawPitch(d);paintObjects(d);drawScale();
  }finally{ctx=sv.ctx;theme=sv.theme;Object.assign(V,sv.V);}
  return{url:c.toDataURL('image/jpeg',0.9),w:pw,h:ph};
}
function pdfFlow(doc,items,x,y,w,bottom,fs){
  const lh=fs*0.3528*1.3;let trunc=false;
  const room=n=>y+lh*n<=bottom;
  for(const it of items){
    if(trunc)break;
    if(it.label){
      if(!room(2)){trunc=true;break;}
      y+=lh*0.35;doc.setFont('helvetica','bold');doc.setFontSize(fs-1);doc.setTextColor(...PC.orange);doc.text(it.label,x,y+lh*0.8);y+=lh*1.15;continue;
    }
    doc.setFont('helvetica',it.bold?'bold':'normal');doc.setFontSize(fs);doc.setTextColor(...(it.color||PC.navy));
    const ind=it.d*3.2,mw=it.k==='p'?0:3.6,lines=doc.splitTextToSize(pdfClean(it.t),Math.max(10,w-ind-mw));
    for(let i=0;i<lines.length;i++){
      if(!room(1)){trunc=true;doc.setTextColor(...PC.gray);doc.text('...',x+ind+mw,y+lh*0.8-0.1);break;}
      if(i===0&&it.k==='b'){doc.setFillColor(...PC.orange);doc.circle(x+ind+1,y+lh*0.62,0.55,'F');}
      if(i===0&&it.k==='n'){doc.setFont('helvetica','bold');doc.setTextColor(...PC.orange);doc.text(it.n+'.',x+ind,y+lh*0.8);doc.setFont('helvetica',it.bold?'bold':'normal');doc.setTextColor(...(it.color||PC.navy));}
      doc.text(lines[i],x+ind+mw,y+lh*0.8);y+=lh;
    }
  }
  return y;
}

    const dw=doc.getTextWidth(dur);doc.setTextColor(...PC.navy);
    doc.text(doc.splitTextToSize(pdfClean(d.name||'Latihan'),190-26-dw-6)[0]||'',22,y+7);
    const c=counts(d),pt=playerText(c);
    doc.setFont('helvetica','normal');doc.setFontSize(7.8);doc.setTextColor(...PC.gray);
    doc.text(pdfClean([d.fmt,pt.tot+' pemain',equipText(c)!=='—'?equipText(c):''].filter(Boolean).join('  |  ')).slice(0,120),22,y+11.2);
    doc.setFontSize(8.5);doc.setTextColor(...PC.navy);
    shown.forEach((l,j)=>doc.text(j===2&&gl.length>3?l.replace(/\s*\S*$/,'')+'...':l,22,y+15.6+j*4.1));
    y+=rh+2.5;
  });
}
function drillPages(doc,s,d,i,n){
  let cont=false,y;
  const open=()=>{doc.addPage();runHead(doc,s,'Latihan '+(i+1)+' dari '+n+(cont?'  |  lanjutan':''));drillTitle(doc,d,i,n,24);y=31;};
  open();
  const sec=drillSections(d);
  const measure=f=>{const l=f*0.3528*1.4;doc.setFont('helvetica','normal');doc.setFontSize(f);let h=0;
    sec.forEach(it=>{if(it.label){h+=2+l*1.15+3;}else{const ind=it.d*5,mw=it.k==='p'?0:5;h+=doc.splitTextToSize(pdfClean(it.t),184-ind-mw).length*l;}});return h;};
  let fs=9.5;for(const f of [9.5,9,8.5,8,7.5,7]){fs=f;if(227-measure(f)>=62)break;}
  const imgMax=Math.max(40,Math.min(132,227-measure(fs)));
  // diagram lapangan (berbingkai)
  const img=renderDrillImage(d,186,imgMax),bw=img.w+4,bx=10+(190-bw)/2;
  doc.setDrawColor(...PC.navy);doc.setLineWidth(0.5);doc.roundedRect(bx,y,bw,img.h+4,1.5,1.5,'S');
  doc.addImage(img.url,'JPEG',bx+2,y+2,img.w,img.h);
  y+=img.h+4+3;
  // info latihan (sel berbingkai)
  const c=counts(d),pt=playerText(c);
  const cells=[['FORMAT',d.fmt||'-',42],['PEMAIN',pt.tot+(pt.txt!=='—'?' ('+pt.txt+')':''),50],['PERALATAN',equipText(c),50],['AREA LATIHAN',areaText(d).replace('Area latihan ',''),50]];
  let cx=10;doc.setLineWidth(0.3);doc.setDrawColor(...PC.line);
  cells.forEach(([l,v,w])=>{doc.roundedRect(cx,y,w-2,15,1.5,1.5,'S');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...PC.orange);doc.text(l,cx+2.5,y+4.4);
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...PC.navy);
    const ls=[].concat(...pdfClean(v).split('\n').map(t=>doc.splitTextToSize(t,w-7))).slice(0,2);ls.forEach((t,k)=>doc.text(t,cx+2.5,y+8.6+k*3.6));cx+=w;});
  y+=15+4;
  // penjelasan (kotak per bagian)
  const lh=fs*0.3528*1.4,bottom=284;
  let box=null;
  const close=()=>{if(box){doc.setDrawColor(...PC.line);doc.setLineWidth(0.3);doc.roundedRect(10,box,190,y-box+1,1.5,1.5,'S');box=null;y+=3;}};
  const start=(label)=>{box=y;y+=2;doc.setFont('helvetica','bold');doc.setFontSize(fs-1);doc.setTextColor(...PC.orange);doc.text(label,13,y+lh*0.7);y+=lh*1.15;};
  let curLabel=null;
  for(const it of sec){
    if(it.label){close();curLabel=it.label;if(y+lh*3>bottom){cont=true;open();}start(it.label);continue;}
    doc.setFont('helvetica','normal');doc.setFontSize(fs);doc.setTextColor(...PC.navy);
    const ind=it.d*5,mw=it.k==='p'?0:5,lines=doc.splitTextToSize(pdfClean(it.t),184-ind-mw);
    lines.forEach((ln,j)=>{
      if(y+lh>bottom){close();cont=true;open();start(curLabel+' (lanjutan)');doc.setFont('helvetica','normal');doc.setFontSize(fs);doc.setTextColor(...PC.navy);}
      if(j===0&&it.k==='b'){doc.setFillColor(...PC.orange);doc.circle(13+ind+1.2,y+lh*0.62,0.7,'F');}
      if(j===0&&it.k==='n'){doc.setFont('helvetica','bold');doc.setTextColor(...PC.orange);doc.text(it.n+'.',13+ind,y+lh*0.8);doc.setFont('helvetica','normal');doc.setTextColor(...PC.navy);}
      doc.text(ln,13+ind+mw,y+lh*0.8);y+=lh;});
  }
  close();
}
function buildPdf(list){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});let first=true;
  list.forEach(s=>{
    overviewPages(doc,s,first);first=false;
    s.drills.forEach((d,i)=>drillPages(doc,s,d,i,s.drills.length));
  });
  const N=doc.getNumberOfPages();
  for(let i=1;i<=N;i++){doc.setPage(i);doc.setDrawColor(...PC.line);doc.setLineWidth(0.25);doc.line(10,289,200,289);
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...PC.gray);doc.text('Garuda Soccer Academy  -  Rencana sesi latihan',10,293);doc.text('Halaman '+i+' / '+N,200,293,{align:'right'});}
  return doc;
}
function pdfName(list){
  if(list.length===1){const s=list[0],slug=(s.title||'sesi').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'sesi';return 'Sesi_'+(s.date||'tanpa-tanggal')+'_'+slug+'.pdf';}
  return 'Rencana-sesi-latihan_'+list.length+'-sesi.pdf';
}
async function exportPdf(list){
  if(!list||!list.length)return;
  try{
    setStat('Membuat PDF…');await ensureJsPdf();
    const sorted=list.slice().sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:0);
    const doc=buildPdf(sorted),buf=doc.output('arraybuffer');
    dlBlob(pdfName(sorted),buf,'application/pdf');setStat('PDF siap ✓');
  }catch(e){
    const c=e&&e.code;
    setStat(c==='declined'?'Ekspor dibatalkan':c==='unavailable'||c==='not_granted'?'Unduhan PDF tidak tersedia di tampilan ini':'Gagal membuat PDF');
  }
}


/* ================= unduh / cadangan / impor (versi GitHub Pages) ================= */
function dlBlob(name,data,type){
  const bl=new Blob([data],{type:type||'application/octet-stream'}),u=URL.createObjectURL(bl),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function exportJson(ids){
  save();
  const list=(ids||Object.keys(LIB)).filter(id=>LIB[id]).map(id=>({id,updated:LIB[id].updated,data:LIB[id].data}));
  if(!list.length)return;
  const name=list.length===1?'Sesi_'+(list[0].data.date||'tanpa-tanggal')+'.json':'Cadangan-sesi-latihan_'+todayISO()+'.json';
  dlBlob(name,JSON.stringify({app:'papan-latihan',v:1,sessions:list}),'application/json');
  setStat(list.length===1?'Sesi diunduh (.json)':'Cadangan diunduh ('+list.length+' sesi)');
}
function importJson(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      if(!o||o.app!=='papan-latihan'||!Array.isArray(o.sessions))throw new Error('format');
      let add=0,upd=0,skip=0;
      o.sessions.forEach(e=>{
        const d=e&&e.data;if(!d||!Array.isArray(d.drills)||!d.drills.length){skip++;return;}
        const id=String(e.id||d.id||('s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)));d.id=id;normSession(d);
        const loc=LIB[id],up=+e.updated||Date.now();
        if(!loc){LIB[id]={updated:up,data:d,sig:JSON.stringify(d)};add++;}
        else if(up>loc.updated){LIB[id]={updated:up,data:d,sig:JSON.stringify(d)};upd++;}
        else skip++;
      });
      if(LIB[S.id]&&LIB[S.id].data!==S){S=LIB[S.id].data;lastSnap=JSON.stringify(S);refreshAll();}
      persistLocal();renderLibrary();
      setStat('Impor: '+add+' baru, '+upd+' diperbarui'+(skip?', '+skip+' dilewati':''));
    }catch(err){setStat('Impor gagal: berkas bukan cadangan Papan Latihan');}
  };
  fr.readAsText(file);
}

/* ================= init ================= */
loadLocal();
lastSnap=JSON.stringify(S);
let t0='dark';try{t0=localStorage.getItem('sp-theme')||'dark';}catch(e){}
buildRTE();buildPalette();setTheme(t0==='light'?'light':'dark');refreshAll();
setStat('Tersimpan di browser');initRemote();
</script>
